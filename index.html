<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Fairy Tarot</title>
<link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle, #4b2861, #190b22 75%);
      color: #fff0c9;
      font-family: Georgia, serif;
    }

    #game {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .sun {
  width: min(70vw, 320px);
  height: min(70vw, 320px);
  object-fit: contain;
  mix-blend-mode: screen;
  margin-bottom: 10px;
  animation: sunSpin 12s linear infinite, sunGlow 2.5s ease-in-out infinite;
}

@keyframes sunSpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

@keyframes sunGlow {
  0%, 100% {
    filter: drop-shadow(0 0 8px rgba(255, 220, 120, 0.35));
  }
  50% {
    filter: drop-shadow(0 0 28px rgba(255, 220, 120, 0.9));
  }
}

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 11vw, 5rem);
      letter-spacing: 0.12em;
      text-shadow: 0 0 18px #d78ac5;
    }

    .subtitle {
      font-size: clamp(1rem, 5vw, 1.4rem);
      margin: 18px 0 30px;
    }

    button {
      border: 2px solid #f5b7dc;
      border-radius: 30px;
      padding: 15px 30px;
      background: #9b3d7a;
      color: white;
      font-family: Georgia, serif;
      font-size: 1.1rem;
      box-shadow: 0 0 20px rgba(255, 180, 230, 0.4);
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <main id="game">

    <img
      src="loading-sun.png"
      class="sun"
      alt="Fairy Tarot Sun"
    >

    <h1>FAIRY TAROT</h1>

    <div class="loading-title" style="font-family: Georgia, 'Times New Roman', serif !important; font-weight: 900; letter-spacing: 0.08em;">FAIRY TAROT</div>

    <button onclick="alert('IT WORKS! 🧚‍♀️✨')">
      DRAW A CARD
    </button>

  </main>

</body>
</html>
