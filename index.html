<!doctype html>
<html lang="en">
<head>

  <title>Fairy Tarot</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="loading">

    <h1>FAIRY TAROT</h1>
    <p>✨ A magical journey awaits ✨</p>
  </div>

  <div id="game" style="display:none;">
